stages:
  generate_data:
    cmd: python src/generate_data.py
    deps:
      - src/generate_data.py
    params:
      - base.random_state
      - data_generation.num_days
      - data_generation.interval_minutes
    outs:
      - data/raw/server_metrics.csv

  preprocess:
    cmd: python src/preprocess.py
    deps:
      - src/preprocess.py
      - data/raw/server_metrics.csv
    params:
      - preprocessing.val_size
      - preprocessing.test_size
    outs:
      - data/processed/
      - models/scaler.pkl

  train:
    cmd: python src/train.py
    deps:
      - src/train.py
      - data/processed/X_train.csv
      - data/processed/y_train.csv
    params:
      - base.random_state
      - training.n_estimators
      - training.max_depth
    outs:
      - models/server_cpu_model.pkl

  evaluate:
    cmd: python src/evaluate.py
    deps:
      - src/evaluate.py
      - data/processed/X_test.csv
      - data/processed/y_test.csv
      - models/server_cpu_model.pkl
    params:
      - evaluation.r2_threshold
      - evaluation.mae_threshold
    metrics:
      - metrics/metrics.json:
          cache: false
    plots:
      - metrics/prediction_vs_actual.png:
          cache: false
