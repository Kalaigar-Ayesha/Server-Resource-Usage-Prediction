stages:
  train_pipeline:
    cmd: python -m src.pipeline.training_pipeline
    deps:
      - src/pipeline/training_pipeline.py
      - src/components/data_ingestion.py
      - src/components/data_validation.py
      - src/components/data_transformation.py
      - src/components/model_training.py
      - src/components/model_evaluation.py
    params:
      - base.random_state
      - data_generation.num_days
      - data_generation.interval_minutes
      - preprocessing.val_size
      - preprocessing.test_size
      - training.n_estimators
      - training.max_depth
      - evaluation.r2_threshold
      - evaluation.mae_threshold
    outs:
      - data/raw/server_metrics.csv
      - data/processed/
      - models/server_cpu_model.pkl
      - models/scaler.pkl
    metrics:
      - metrics/metrics.json:
          cache: false
    plots:
      - metrics/prediction_vs_actual.png:
          cache: false
