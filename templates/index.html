<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Resource Predictor</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --border: #334155;
            --success: #10b981;
            --error: #ef4444;
        }
        
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 2rem;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--card-bg);
            border-radius: 1rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5), 0 4px 6px -4px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 600px;
            padding: 2.5rem;
            border: 1px solid var(--border);
        }

        h1 {
            margin-top: 0;
            font-size: 1.875rem;
            font-weight: 700;
            text-align: center;
            background: linear-gradient(to right, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        p.subtitle {
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 2rem;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.25rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        label {
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-muted);
        }

        input {
            background-color: var(--bg-color);
            border: 1px solid var(--border);
            color: var(--text-color);
            padding: 0.75rem 1rem;
            border-radius: 0.5rem;
            font-size: 1rem;
            transition: border-color 0.15s, box-shadow 0.15s;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25);
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 0.875rem 1.5rem;
            border-radius: 0.5rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.15s, transform 0.1s;
            width: 100%;
            margin-top: 1rem;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:active {
            transform: scale(0.98);
        }

        .result-box {
            margin-top: 2rem;
            padding: 1.5rem;
            border-radius: 0.75rem;
            text-align: center;
            border: 1px solid var(--border);
            animation: fadeIn 0.3s ease-out forwards;
        }

        .result-success {
            background-color: rgba(16, 185, 129, 0.1);
            border-color: rgba(16, 185, 129, 0.3);
        }

        .result-error {
            background-color: rgba(239, 68, 68, 0.1);
            border-color: rgba(239, 68, 68, 0.3);
        }

        .result-value {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--success);
            margin: 0.5rem 0;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Resource Predictor</h1>
        <p class="subtitle">Enter current metrics to predict future CPU usage</p>

        <form action="/predict" method="post">
            <div class="form-grid">
                <div class="form-group">
                    <label for="cpu_usage">Current CPU Usage (%)</label>
                    <input type="number" step="0.1" id="cpu_usage" name="cpu_usage" value="{{ form_data.get('cpu_usage', '') if form_data else '' }}" required placeholder="45.5">
                </div>
                
                <div class="form-group">
                    <label for="memory_usage">Memory Usage (%)</label>
                    <input type="number" step="0.1" id="memory_usage" name="memory_usage" value="{{ form_data.get('memory_usage', '') if form_data else '' }}" required placeholder="60.2">
                </div>
                
                <div class="form-group">
                    <label for="disk_usage">Disk Usage (%)</label>
                    <input type="number" step="0.1" id="disk_usage" name="disk_usage" value="{{ form_data.get('disk_usage', '') if form_data else '' }}" required placeholder="70.0">
                </div>
                
                <div class="form-group">
                    <label for="response_time">Response Time (s)</label>
                    <input type="number" step="0.01" id="response_time" name="response_time" value="{{ form_data.get('response_time', '') if form_data else '' }}" required placeholder="0.25">
                </div>

                <div class="form-group">
                    <label for="network_in">Network In (MB/s)</label>
                    <input type="number" step="0.1" id="network_in" name="network_in" value="{{ form_data.get('network_in', '') if form_data else '' }}" required placeholder="120.5">
                </div>

                <div class="form-group">
                    <label for="network_out">Network Out (MB/s)</label>
                    <input type="number" step="0.1" id="network_out" name="network_out" value="{{ form_data.get('network_out', '') if form_data else '' }}" required placeholder="80.2">
                </div>

                <div class="form-group full-width">
                    <label for="request_count">Request Count</label>
                    <input type="number" id="request_count" name="request_count" value="{{ form_data.get('request_count', '') if form_data else '' }}" required placeholder="5000">
                </div>
            </div>

            <button type="submit">Predict Future CPU Usage</button>
        </form>

        {% if results is not none %}
        <div class="result-box result-success">
            <div style="color: var(--text-muted); font-size: 0.875rem; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600;">Predicted CPU Usage</div>
            <div class="result-value">{{ results }}%</div>
        </div>
        {% endif %}

        {% if error %}
        <div class="result-box result-error">
            <div style="color: var(--error); font-weight: 500;">Error: {{ error }}</div>
        </div>
        {% endif %}
    </div>
</body>
</html>
